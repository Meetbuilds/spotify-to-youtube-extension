<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 250px; padding: 15px; font-family: sans-serif; }
    input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
    
    .btn-container { display: flex; gap: 5px; margin-top: 10px; }
    button { flex: 1; padding: 10px; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
    
    #transferBtn { background: #1DB954; }
    #transferBtn:hover { background: #1ed760; }
    #transferBtn:disabled { background: #ccc; cursor: not-allowed; }

    #stopBtn { background: #e91e63; }
    #stopBtn:hover { background: #d81557; }
    #stopBtn:disabled { background: #ccc; cursor: not-allowed; }

    .row { display: flex; gap: 5px; }
    #status { margin-top: 10px; font-size: 12px; color: #555; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h3>Spotify Transfer</h3>
  <input type="text" id="ytPlaylistId" placeholder="YouTube Playlist ID (e.g., PLsah...)" />
  
  <div class="row">
    <input type="number" id="startIndex" placeholder="Start at # (0)" value="0" />
  </div>

  <div class="btn-container">
    <button id="transferBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>
  
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
