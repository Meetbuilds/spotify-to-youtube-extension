<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 250px; padding: 15px; font-family: sans-serif; }
    input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #1DB954; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #1ed760; }
    .row { display: flex; gap: 5px; }
  </style>
</head>
<body>
  <h3>Spotify Transfer</h3>
  <input type="text" id="ytPlaylistId" placeholder="YouTube Playlist ID (e.g., PLsah...)" />
  
  <div class="row">
    <input type="number" id="startIndex" placeholder="Start at # (0)" value="0" />
  </div>

  <button id="transferBtn">Start Transfer</button>
  <p id="status" style="margin-top: 10px; font-size: 12px; color: #555;"></p>
  <script src="popup.js"></script>
</body>
</html>
